rachana: 1
sutra: data-table-example
version: 1
libraries: [core@1]
title: { id: "'Data table'" }
data:
  orders: { rows: [ { ORDER_ID: A1, AMT_USD: 120 }, { ORDER_ID: A2, AMT_USD: 80 } ] }
panels:
  - use: core/data-table@1
    with:
      rows: $.orders
      columns: [ { label: Order, bind: "@.ORDER_ID" }, { label: Amount, bind: "@.AMT_USD", fmt: amount0, total: true } ]
